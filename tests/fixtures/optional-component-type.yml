buildingblocks: "0.2.1"
info:
  title: "PDF Preview"
components:
  - type: "Modal"
    name: "PDF Preview"
    children:
      - name: "PDF Viewer"
      - type: "Button"
        name: "Close"
  - type: "Modal"
    name: "Inventory item dialog"
    children:
      - type: "Input"
        name: "Name"
      - type: "Input"
        name: "Serial Number"
      - type: "Input"
        name: "Price"
      - type: "Button"
        name: "Save"
      - type: "Button"
        name: "Cancel"
  - name: "Tracking Inventory"
    children:
      - type: "Button"
        name: "Add item"
      - type: "Button"
        name: "Print"
      - type: "Button"
        name: "Export"
      - name: "Inventory table"
        children:
          - name: "Filter"
            children:
              - type: "Input"
                name: "Name Filter"
              - type: "Input"
                name: "Serial Number Filter"
              - type: "Input"
                name: "Price Filter"
          - name: "Table row"
            children:
              - type: "Icon Button"
                name: "Edit"
              - type: "Label"
                name: "Name"
              - type: "Label"
                name: "Serial Number"
              - type: "Label"
                name: "Value"
actions:
  - name: "Search existing inventory"
  - name: "Update inventory item"
  - name: "Read inventory item"
  - name: "Create inventory item"
  - name: "Create CSV file"
  - name: "Create PDF file"
  - name: "Download CSV file"
